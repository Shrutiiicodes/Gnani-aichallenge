services:
  - type: web
    name: bhasha-dub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GNANI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
